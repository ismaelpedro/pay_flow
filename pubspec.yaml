name: pay_flow
description: A new Flutter project.

publish_to: "none"
version: 2.0.28+317

environment:
  sdk: ">=3.3.4 <4.0.0"
  flutter: ">=3.19.6"

dependencies:
  flutter:
    sdk: flutter
  flutter_localizations:
    sdk: flutter

  # STATE MANAGEMENT
  flutter_bloc: ^8.1.5
  bloc: ^8.1.4

  # NETWORKING
  dio: ^5.4.3+1
  talker_dio_logger: ^4.1.5
  cached_network_image: ^3.3.1

  # ASSETS MANAGEMENT
  image_picker: ^1.1.1
  file_picker: ^8.0.3
  path_provider: ^2.1.3
  camera: ^0.10.5+9
  boleto_utils: ^1.0.3
  flutter_barcode_scanner: ^2.0.0

  # GOOGLE/APPLE
  sign_in_with_apple: ^6.1.0
  google_sign_in: ^6.2.1
  google_mobile_ads: ^5.0.0

  # FIREBASE/ONESIGNAL
  firebase_core: ^2.30.1
  firebase_analytics: ^10.10.4
  firebase_crashlytics: ^3.5.4
  firebase_performance: ^0.9.4+4
  firebase_auth: ^4.19.4
  firebase_storage: ^11.7.4
  firebase_messaging: ^14.9.1

  # NOTIFICATIONS
  flutter_local_notifications: ^17.1.1
  timezone: ^0.9.3
  flutter_timezone: ^1.0.8

  # UI
  cupertino_icons: ^1.0.8
  shimmer: ^3.0.0
  device_preview: ^1.1.0
  flutter_svg: ^2.0.10+1
  mask_text_input_formatter: ^2.9.0
  flutter_masked_text2: ^0.9.1
  lottie: ^3.1.0

  # UTILITIES
  package_info_plus: ^8.0.0
  intl: 0.18.1
  url_launcher: ^6.2.6
  upgrader: ^10.3.0
  freezed_annotation: ^2.4.1
  json_annotation: ^4.9.0

  # DI/ARCHITECTURE
  get_it: ^7.7.0
  injectable: ^2.4.1
  shared_preferences: ^2.2.3

dev_dependencies:
  flutter_lints: ^3.0.2
  flutter_test:
    sdk: flutter
  integration_test:
    sdk: flutter

  # TESTING
  mocktail: ^1.0.3
  mocktail_image_network: ^1.1.0
  firebase_auth_mocks: ^0.13.0
  google_sign_in_mocks: ^0.3.0
  mockingjay: ^0.5.0
  faker: ^2.1.0

  # CODE GENERATION
  build_runner: ^2.4.9
  freezed: ^2.5.2
  json_serializable: ^6.8.0
  injectable_generator: ^2.6.1

flutter:
  uses-material-design: true
  generate: true

  assets:
    - assets/fonts/
    - assets/images/
    - assets/lotties/
    - assets/mocks/
    - shorebird.yaml

  fonts:
    - family: Inter
      fonts:
        - asset: assets/fonts/Inter-Regular.ttf
    - family: LexendDeca
      fonts:
        - asset: assets/fonts/LexendDeca-Regular.ttf
